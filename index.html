<!doctype html>
<html lang="fa" dir="rtl" data-theme="light" data-palette="sepia">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e6e9ef" />
    <title>خط روشن — راهنمای امنیت دیجیتال</title>
    <meta
      name="description"
      content="راهنمای عملی امنیت و حریم خصوصی دیجیتال"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e4e8f'/%3E%3Cpath d='M9 8h9a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H9z' fill='%23fbfbf9'/%3E%3C/svg%3E"
    />

    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/book.css" />
    <link rel="stylesheet" href="assets/css/ui.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">پرش به متن</a>

    <!-- اسپرایت آیکون‌ها: یک‌بار تعریف می‌شوند و همه‌جا استفاده می‌شوند -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      style="display: none"
      aria-hidden="true"
    >
      <symbol
        id="i-list"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      >
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
      </symbol>
      <symbol
        id="i-search"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </symbol>
      <symbol
        id="i-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </symbol>
      <symbol
        id="i-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        />
      </symbol>
      <symbol
        id="i-palette"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"
        />
        <circle cx="7.5" cy="11.5" r="1.2" />
        <circle cx="10.5" cy="7.5" r="1.2" />
        <circle cx="15" cy="8" r="1.2" />
      </symbol>
      <symbol
        id="i-expand"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"
        />
      </symbol>
      <symbol
        id="i-close"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
      <symbol
        id="i-chev-left"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </symbol>
      <symbol
        id="i-chev-right"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m9 18 6-6-6-6" />
      </symbol>
      <symbol
        id="i-info"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      >
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v5M12 8h.01" />
      </symbol>
      <symbol
        id="i-quill"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 20c6 0 10-4 12-10l1.5-4.5L13 7C7 9 4 13 4 20z" />
        <path d="M4 20 12 12" />
      </symbol>
      <symbol id="i-mark" viewBox="0 0 72 72" fill="none">
        <circle
          cx="36"
          cy="36"
          r="25.5"
          stroke="currentColor"
          stroke-opacity=".34"
          stroke-width="1.5"
        />
        <path
          d="M36 29.4c-3.1-3.4-10.4-4-15.4-2.4v18.6c5-1.6 12.3-1 15.4 2.4 3.1-3.4 10.4-4 15.4-2.4V27c-5-1.6-12.3-1-15.4 2.4Z"
          stroke="currentColor"
          stroke-width="2.3"
          stroke-linejoin="round"
        />
        <path
          d="M36 29.4v18.6"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          opacity=".7"
        />
      </symbol>
      <symbol
        id="i-arrow-start"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 12H5M11 18l-6-6 6-6" />
      </symbol>
      <symbol
        id="i-key"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="8" cy="15" r="4" />
        <path d="m10.8 12.2 8.2-8.2M17 6l2.5 2.5M14.5 8.5 17 11" />
      </symbol>
      <symbol
        id="i-hdd"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="5" width="18" height="6" rx="2" />
        <rect x="3" y="13" width="18" height="6" rx="2" />
        <path d="M7 8h.01M7 16h.01" />
      </symbol>
      <symbol
        id="i-shield"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3 4 6v6c0 5 3.6 8.9 8 10 4.4-1.1 8-5 8-10V6l-8-3z" />
        <path d="m9 12 2 2 4-4" />
      </symbol>
      <symbol
        id="i-check"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m20 6-11 11-5-5" />
      </symbol>
    </svg>

    <!-- آیکون همبرگر -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
      <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linecap="round">
        <path d="M3 6h18M3 12h18M3 18h18" />
      </symbol>
      <symbol id="i-prev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6" />
      </symbol>
      <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6" />
      </symbol>
    </svg>

    <div class="shell" id="shell">
      <!-- فهرست کناری -->
      <aside class="sidebar" id="sidebar" aria-label="فهرست کتاب">
        <div class="sidebar__head">
          <a class="sidebar__brand" href="#/cover" id="sidebarTitle"></a>
          <button class="icon-btn" id="btnSidebarClose" title="بستن فهرست" aria-label="بستن فهرست">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
        <div class="sidebar__scroll" id="sidebarScroll">
          <div id="sidebarContent"></div>
        </div>
        <div class="sidebar__foot">
          <button class="foot-btn" id="btnTheme" aria-label="تغییر پوسته" title="پوستهٔ بعدی (P)">
            <svg aria-hidden="true"><use href="#i-palette" id="themeIcon" /></svg>
          </button>
          <button class="foot-btn" id="btnZen" aria-label="حالت تمرکز" aria-pressed="false" title="حالت تمرکز (Z)">
            <svg aria-hidden="true"><use href="#i-expand" /></svg>
          </button>
        </div>
      </aside>

      <div class="scrim" id="scrim" hidden></div>

      <!-- نوار بالای سند -->
      <header class="topbar">
        <button class="top-btn topbar__menu" id="btnMenu" title="فهرست"
                aria-expanded="false" aria-controls="sidebar">
          <svg><use href="#i-menu" /></svg>
          <span>فهرست</span>
        </button>
        <span class="topbar__title" id="topbarTitle"></span>
        <button class="top-btn" id="btnSearch" title="جست‌وجو (Ctrl+K)">
          <svg><use href="#i-search" /></svg>
          <span>جست‌وجو</span>
        </button>
      </header>

      <!-- متن سند -->
      <main class="doc-scroll" id="docScroll">
        <div class="doc-sheet">
          <div id="content" tabindex="-1"></div>
        </div>

        <nav class="pager" id="pager" aria-label="پیمایش فصل‌ها">
          <button class="pager__btn" id="btnPrev" type="button">
            <svg class="pager__chev" aria-hidden="true"><use href="#i-chev-right"></use></svg>
            <span class="pager__text">
              <span class="pager__dir">قبلی</span>
              <span class="pager__name" id="prevLabel"></span>
            </span>
          </button>
          <button class="pager__btn pager__btn--next" id="btnNext" type="button">
            <span class="pager__text">
              <span class="pager__dir">بعدی</span>
              <span class="pager__name" id="nextLabel"></span>
            </span>
            <svg class="pager__chev" aria-hidden="true"><use href="#i-chev-left"></use></svg>
          </button>
        </nav>

        <div class="progress" role="progressbar" aria-valuemin="0"
             aria-valuemax="100" aria-valuenow="0">
          <div class="progress__bar" id="progressBar"></div>
        </div>

        <!-- راه خروج از حالت تمرکز -->
        <button class="zen-exit" id="btnZenExit" title="خروج از حالت تمرکز (Esc)" hidden>
          <svg><use href="#i-close" /></svg>
          <span>خروج از تمرکز</span>
        </button>
      </main>
    </div>

    <!-- مودال جست‌وجو -->
    <div
      class="modal"
      id="searchModal"
      role="dialog"
      aria-modal="true"
      aria-label="جست‌وجو در کتاب"
    >
      <div class="modal__panel">
        <div class="modal__head">
          <span class="modal__title"
            ><svg><use href="#i-search" /></svg> جست‌وجو در کتاب</span
          >
          <button class="modal__close" data-close title="بستن">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
        <div class="search-field">
          <svg><use href="#i-search" /></svg>
          <input
            type="search"
            id="searchInput"
            placeholder="چیزی بنویس… مثلاً روشن"
            autocomplete="off"
          />
        </div>
        <div class="modal__body" id="searchResults"></div>
      </div>
    </div>


    <div class="toast" id="toast">
      <svg><use href="#i-check" /></svg>
      <span id="toastText"></span>
    </div>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
