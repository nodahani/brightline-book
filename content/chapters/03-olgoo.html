<p>
  این فصل یک الگو است: فایلش را کپی کن، تغییرِ نامش بده و متن خودت را جایش
  بگذار.
</p>

<h2>تیتر کوچک‌تر</h2>
<p>
  متنِ معمولی با <strong>بولد</strong>، با <em>مورب</em>، و با
  <a href="#">لینک</a>.
</p>

<ul>
  <li>مورد اول فهرست</li>
  <li>مورد دوم فهرست</li>
</ul>

<blockquote>
  <p>نقل‌قول، با خطِ کنار.</p>
</blockquote>

<pre><code>بلوکِ کد، چپ‌چین و خوانا.</code></pre>

<hr />

<p>خطِ جداکنندهٔ بالا، فقط فاصلهٔ بصری می‌سازد.</p>
